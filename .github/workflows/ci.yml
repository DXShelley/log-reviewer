name: Development CI
on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Format
        shell: bash
        run: test -z "$(gofmt -l cmd internal tests tools)"
      - name: Reject generated artifacts
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(dist|node_modules|reports|\.work)/|\.(exe|dll|so|dylib|zip|tar\.gz)$'; then
            echo 'Publish binaries as GitHub Release assets, never repository files.'
            exit 1
          fi
      - run: go mod verify
      - run: go test ./... -timeout 5m
      - run: go vet ./...
      - name: Documentation links
        if: runner.os == 'Linux'
        run: python3 scripts/check-doc-links.py
