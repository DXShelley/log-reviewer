name: Delivery CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject generated artifacts
        shell: bash
        run: |
          if git ls-files | grep -Ei '(^|/)(dist|node_modules|reports|\.work)/|\.(exe|dll|so|dylib|zip|tar\.gz)$'; then
            echo 'Publish binaries as GitHub Release assets, never repository files.'
            exit 1
          fi
      - name: Documentation links
        run: python3 scripts/check-doc-links.py
