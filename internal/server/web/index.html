<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Log Reviewer · 日志分析</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="layout.css"></head>
<body>
<header><div class="brand"><span class="logo" aria-hidden="true">▤</span><strong>Log Reviewer</strong><span class="version">0.1</span></div><div class="header-right"><span class="local">● 本机分析</span><button id="report" disabled>导出 JSON 报告</button></div></header>
<main>
<section class="files-band"><div class="section-label"><h1>日志文件</h1><span id="file-count">未选择文件</span></div><div class="file-actions"><button id="browse" class="primary">＋ 选择文件</button><button id="upload-button">导入文件</button><input id="upload" type="file" multiple hidden><button id="path-toggle" title="输入文件路径或通配符">输入路径</button><button id="rules-toggle">识别规则</button><label class="check"><input id="all" type="checkbox">包含 INFO / DEBUG</label><button id="analyze" class="primary" disabled>开始分析</button><button id="cancel" hidden>取消</button></div><div id="files" class="file-list"></div><div id="paths-panel" hidden><textarea id="paths" rows="3" placeholder="每行一个路径，可使用 *.log 通配符"></textarea><button id="add-paths">添加路径</button></div><div id="rules-panel" hidden><label for="rules">自定义格式规则 JSON</label><textarea id="rules" rows="5" placeholder='[{"name":"custom","pattern":"^(?P<time>.+?) (?P<level>ERROR|WARN) (?P<message>.*)$","time_layout":"2006-01-02 15:04:05"}]'></textarea></div><div id="progress-area" hidden><progress id="progress" max="100" value="0"></progress><span id="progress-text"></span></div><div id="error" role="alert" hidden></div></section>
<section class="stats" aria-label="分析摘要"><div><span>已分析</span><strong id="size-stat">—</strong></div><div><span>日志事件</span><strong id="events-stat">—</strong></div><div><span>问题分类</span><strong id="groups-stat">—</strong></div><div><span>错误 / 严重</span><strong id="error-stat" class="red">—</strong></div><div><span>警告</span><strong id="warn-stat" class="amber">—</strong></div><div><span>分析耗时</span><strong id="time-stat">—</strong></div></section>
<form id="search" class="filters"><div class="search-input"><label for="keyword">关键字</label><input id="keyword" type="search" placeholder="搜索消息、堆栈、请求 ID"></div><div><label for="regex">正则表达式</label><input id="regex" placeholder="timeout|refused"></div><div><label for="from">开始时间</label><input id="from" type="datetime-local" step="1"></div><div><label for="to">结束时间</label><input id="to" type="datetime-local" step="1"></div><div><label for="source">文件范围</label><select id="source"><option value="-1">全部文件</option></select></div><button type="submit" id="search-button" disabled>搜索</button><button type="button" id="reset" title="重置筛选">↺</button></form>
<section class="workspace"><div class="category-pane"><div class="pane-toolbar"><div class="tabs" role="group" aria-label="日志级别"><button data-level="" class="active">全部</button><button data-level="ERROR">ERROR</button><button data-level="WARN">WARN</button><button data-level="FATAL">FATAL</button></div><select id="sort" aria-label="分类排序"><option value="count">按次数</option><option value="impact">按影响</option><option value="last">按最后时间</option></select><span id="result-count">0 类</span></div><div class="table-wrap"><table><thead><tr><th>问题 / 分类</th><th>次数</th><th>影响</th><th>范围</th><th>首次 / 最后出现</th></tr></thead><tbody id="groups"></tbody></table><div id="empty" class="empty"><span class="empty-icon">▤</span><strong>选择日志文件开始分析</strong></div></div><div id="category-pages" class="occurrence-toolbar" hidden><span id="category-range"></span><div><button id="category-prev" title="上一页分类">←</button><button id="category-next" title="下一页分类">→</button></div></div></div><aside class="detail-pane"><div class="pane-toolbar"><h2>事件详情</h2><div class="detail-actions"><button id="copy-group" title="复制分类摘要" disabled>复制分类</button><button id="export" title="导出当前分类中符合筛选的全部事件" disabled>导出分类</button></div></div><div id="detail-empty" class="empty"><strong>尚未选择分类</strong></div><div id="detail" hidden><div class="detail-summary"><div id="detail-level"></div><h3 id="detail-title"></h3><p id="impact-basis"></p><p id="scope"></p></div><div class="occurrence-toolbar"><span id="occurrence-range"></span><div><button id="prev" title="上一页" disabled>←</button><button id="next" title="下一页" disabled>→</button></div></div><div id="occurrences"></div></div></aside></section>
</main><footer><span id="footer-status">就绪</span><span>UTF-8 / UTF-8 BOM · 只读源文件</span></footer><div id="toast" role="status" hidden></div>
<dialog id="picker"><div class="dialog-header"><h2>选择日志文件</h2><button id="close-picker" title="关闭">✕</button></div><div class="picker-nav"><button id="roots" title="磁盘 / 根目录">磁盘</button><button id="up" title="上一级">↑</button><input id="browse-path" aria-label="目录路径"><button id="go-path">打开</button></div><div class="picker-list" id="picker-list"></div><div class="dialog-footer"><span id="selected-count">已选择 0 个文件</span><button id="confirm-picker" class="primary">添加所选文件</button></div></dialog>
<dialog id="copy-dialog"><div class="dialog-header"><h2>复制内容</h2><button id="close-copy" title="关闭">✕</button></div><div class="copy-body"><p id="copy-status"></p><textarea id="copy-value" readonly rows="12" aria-label="复制内容"></textarea></div><div class="dialog-footer"><button id="save-copy">下载文本</button><button id="retry-copy" class="primary">重试复制</button></div></dialog>
<script src="app.js"></script></body></html>
